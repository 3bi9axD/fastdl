<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>3bi9a World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div class="brand">3BI9A WORLD <span>ALPHA</span></div>
    <div class="stats">
      <div class="pill">🪙 <b id="coins">500</b></div>
      <div class="pill">⭐ LVL <b id="level">1</b></div>
      <div class="xp"><div id="xpBar"></div></div>
    </div>
  </div>

  <div id="mission">
    <div class="mission-kicker">ACTIVE MISSION</div>
    <div id="missionTitle">Talk to Yassine at the delivery shop</div>
    <div id="missionText">Walk to the yellow marker.</div>
  </div>

  <div id="hint">WASD / Arrow keys • E interact • Shift sprint</div>
  <button id="resetBtn" title="Reset save">↻</button>

  <div id="dialog" class="hidden">
    <div class="card">
      <div class="avatar">Y</div>
      <div>
        <div class="npc-name">Yassine • Delivery Manager</div>
        <div id="dialogText">I can give you a delivery job.</div>
      </div>
      <button id="acceptBtn">Accept job +150 🪙</button>
      <button id="closeBtn" class="ghost">Close</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="mobileControls">
    <div id="joyBase"><div id="joyStick"></div></div>
    <div class="mobileBtns">
      <button id="mobileInteract">E</button>
      <button id="mobileSprint">RUN</button>
    </div>
  </div>

  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.181.1/build/three.module.js"}}
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
