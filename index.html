addBox(0,.01,0,18,.03,210,0x3f454c);addBox(0,.01,0,210,.03,18,0x3f454c);for(let z=-96;z<=96;z+=12)addBox(0,.03,z,.25,.02,5,0xf4e66c);for(let x=-96;x<=96;x+=12)addBox(x,.03,0,5,.02,.25,0xf4e66c);addBox(-12,.02,0,5,.12,210,0xb7bcc1);addBox(12,.02,0,5,.12,210,0xb7bcc1);addBox(0,.02,-12,210,.12,5,0xb7bcc1);addBox(0,.02,12,210,.12,5,0xb7bcc1);

function marker(color){const g=new THREE.Group(),ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.12,8,28),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.5}));ring.rotation.x=Math.PI/2;ring.position.y=.18;g.add(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.25,.75,4,16,1,true),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.14,side:THREE.DoubleSide}));beam.position.y=2;g.add(beam);scene.add(g);return g}const npcMarker=marker(0xffd84d);npcMarker.position.set(27,0,-18);const deliveryMarker=marker(0x5de0ff);deliveryMarker.position.set(-35,0,34);deliveryMarker.visible=false;

function makeHuman(shirt=0x2d4964,pants=0x20252d,skin=0xc98f65){

 limbs.leftArm=arm(-1);limbs.rightArm=arm(1);limbs.leftLeg=leg(-1);limbs.rightLeg=leg(1);g.userData.limbs=limbs;return g;
}
const player=makeHuman(0x24364b,0x252832);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.16,16),mat(0xffd84d));cap.position.y=3.05;player.add(cap);scene.add(player);
const yassine=makeHuman(0x8c5a2e,0x26344a,0xd19a6b);yassine.position.set(27,0,-18);yassine.rotation.y=Math.PI;scene.add(yassine);

function makeCar(color=0xd94242){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(3.8,.72,1.9),mat(color,.55));body.position.y=.78;body.castShadow=true;g.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.05,.28,1.76),mat(color,.55));hood.position.set(-1.36,1.12,0);g.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.85,.72,1.68),mat(0x8ac9e9,.28));cabin.position.set(.25,1.35,0);g.add(cabin);const bumper1=new THREE.Mesh(new THREE.BoxGeometry(.18,.26,1.78),mat(0x222222));bumper1.position.set(-1.98,.62,0);g.add(bumper1);const bumper2=bumper1.clone();bumper2.position.x=1.98;g.add(bumper2);for(const x of[-1.18,1.18])for(const z of[-.99,.99]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.25,18),mat(0x111111));wh.rotation.x=Math.PI/2;wh.position.set(x,.48,z*.91);g.add(wh)}return g}
const traffic=[];function addTraffic(route,color,offset=0,speed=7){const car=makeCar(color);scene.add(car);traffic.push({car,route,t:offset,speed});return car}
addTraffic([{x:-78,z:-4},{x:78,z:-4}],0xdd4242,.1,8);addTraffic([{x:78,z:4},{x:-78,z:4}],0x3687d9,.55,7);addTraffic([{x:4,z:-78},{x:4,z:78}],0xe0b93a,.25,6.5);addTraffic([{x:-4,z:78},{x:-4,z:-78}],0x444444,.72,7.5);

const SAVE='3bi9a-world-save-v2';let state={coins:500,xp:0,level:1,mission:'talk',x:0,z:24};try{state={...state,...JSON.parse(localStorage.getItem(SAVE)||'{}')}}catch{}player.position.set(state.x,0,state.z);function save(){state.x=+player.position.x.toFixed(2);state.z=+player.position.z.toFixed(2);localStorage.setItem(SAVE,JSON.stringify(state))}setInterval(save,1800);
const coinsEl=document.querySelector('#coins'),lvlEl=document.querySelector('#level'),xpBar=document.querySelector('#xpBar'),title=document.querySelector('#missionTitle'),text=document.querySelector('#missionText');function syncUI(){coinsEl.textContent=state.coins;lvlEl.textContent=state.level;xpBar.style.width=Math.min(100,state.xp/(state.level*250)*100)+'%';if(state.mission==='talk'){title.textContent='Talk to Yassine at the delivery shop';text.textContent='Walk to the yellow marker and press E.';npcMarker.visible=true;deliveryMarker.visible=false}else if(state.mission==='deliver'){title.textContent='Deliver the package';text.textContent='Reach the blue marker across town.';npcMarker.visible=false;deliveryMarker.visible=true}else{title.textContent='Free roam';text.textContent='Explore the city. Return to Yassine for another delivery.';npcMarker.visible=true;deliveryMarker.visible=false}}syncUI();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const dialog=document.querySelector('#dialog'),dialogText=document.querySelector('#dialogText');function flatDist(obj){return Math.hypot(player.position.x-obj.position.x,player.position.z-obj.position.z)}function interact(){if(flatDist(yassine)<3.8){dialog.classList.remove('hidden');dialogText.textContent=state.mission==='deliver'?'You already have a package. Follow the blue marker!':'I have a delivery for you. Finish it and earn Coins + XP.'}}function reward(){state.coins+=150;state.xp+=120;while(state.xp>=state.level*250){state.xp-=state.level*250;state.level++;toast('LEVEL UP! Level '+state.level)}state.mission='done';save();syncUI();toast('+150 Coins • +120 XP')}document.querySelector('#acceptBtn').onclick=()=>{if(state.mission!=='deliver'){state.mission='deliver';syncUI();save();toast('Delivery started!')}dialog.classList.add('hidden')};document.querySelector('#closeBtn').onclick=()=>dialog.classList.add('hidden');document.querySelector('#resetBtn').onclick=()=>{if(confirm('Reset saved progress?')){localStorage.removeItem(SAVE);location.reload()}};let toastTimer;function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}

let camYaw=0,camPitch=.38,camDistance=8.3,dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('mousedown',e=>{if(e.button!==0)return;dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('mouseup',()=>dragging=false);addEventListener('mousemove',e=>{if(!dragging)return;camYaw-=(e.clientX-lastX)*.005;camPitch=THREE.MathUtils.clamp(camPitch-(e.clientY-lastY)*.004,-.05,.9);lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{camDistance=THREE.MathUtils.clamp(camDistance+e.deltaY*.01,4.5,13)},{passive:true});

let joy={x:0,y:0,sprint:false};const jb=document.querySelector('#joyBase'),js=document.querySelector('#joyStick');function setJoy(e){const r=jb.getBoundingClientRect(),t=e.touches?e.touches[0]:e;let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2);const l=Math.hypot(x,y),m=38;if(l>m){x=x/l*m;y=y/l*m}joy.x=x/m;joy.y=y/m;js.style.transform=`translate(${x}px,${y}px)`}jb.addEventListener('touchstart',setJoy,{passive:false});jb.addEventListener('touchmove',e=>{e.preventDefault();setJoy(e)},{passive:false});jb.addEventListener('touchend',()=>{joy.x=joy.y=0;js.style.transform=''});document.querySelector('#mobileInteract').onclick=interact;document.querySelector('#mobileJump').onclick=jump;const runBtn=document.querySelector('#mobileSprint');runBtn.addEventListener('touchstart',e=>{e.preventDefault();joy.sprint=true});runBtn.addEventListener('touchend',()=>joy.sprint=false);
let vy=0,onGround=true;function jump(){if(onGround&&dialog.classList.contains('hidden')){vy=7.4;onGround=false}}
function animateHuman(h,t,amount=1){const L=h.userData.limbs;if(!L)return;const s=Math.sin(t),c=Math.cos(t);L.leftArm.pivot.rotation.x=s*.62*amount;L.rightArm.pivot.rotation.x=-s*.62*amount;L.leftArm.forePivot.rotation.x=Math.max(0,-s)*.32*amount;L.rightArm.forePivot.rotation.x=Math.max(0,s)*.32*amount;L.leftLeg.pivot.rotation.x=-s*.72*amount;L.rightLeg.pivot.rotation.x=s*.72*amount;L.leftLeg.knee.rotation.x=Math.max(0,s)*.48*amount;L.rightLeg.knee.rotation.x=Math.max(0,-s)*.48*amount}
function moveRoute(obj,points,t,speed,dt){const a=points[0],b=points[1],dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);t=(t+speed*dt/len)%2;let q=t<=1?t:2-t;obj.position.set(a.x+(b.x-a.x)*q,0,a.z+(b.z-a.z)*q);const dir=t<=1?1:-1;obj.rotation.y=Math.atan2(dx*dir,dz*dir);return t}
const clock=new THREE.Clock();let walkT=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);let side=0,forward=0;if(keys['w']||keys['arrowup'])forward+=1;if(keys['s']||keys['arrowdown'])forward-=1;if(keys['a']||keys['arrowleft'])side-=1;if(keys['d']||keys['arrowright'])side+=1;side+=joy.x;forward+=-joy.y;const len=Math.hypot(side,forward),moving=len>.08;
 if(moving&&dialog.classList.contains('hidden')){side/=len;forward/=len;const fwd=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw)),right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw)),dir=fwd.multiplyScalar(forward).add(right.multiplyScalar(side)).normalize();const speed=(keys['shift']||joy.sprint)?9.3:5.6;player.position.x=THREE.MathUtils.clamp(player.position.x+dir.x*speed*dt,-103,103);player.position.z=THREE.MathUtils.clamp(player.position.z+dir.z*speed*dt,-103,103);const targetRot=Math.atan2(dir.x,dir.z);player.rotation.y+=Math.atan2(Math.sin(targetRot-player.rotation.y),Math.cos(targetRot-player.rotation.y))*Math.min(1,dt*12);walkT+=dt*((keys['shift']||joy.sprint)?13:9);animateHuman(player,walkT,1)}else animateHuman(player,0,0);

 const focus=new THREE.Vector3(player.position.x,player.position.y+1.65,player.position.z),horizontal=Math.cos(camPitch)*camDistance;const desired=new THREE.Vector3(focus.x+Math.sin(camYaw)*horizontal,focus.y+Math.sin(camPitch)*camDistance+1.0,focus.z+Math.cos(camYaw)*horizontal);camera.position.lerp(desired,1-Math.pow(.0003,dt));camera.lookAt(focus.x,focus.y+.15,focus.z);

 for(const t of traffic)t.t=moveRoute(t.car,t.route,t.t,t.speed,dt);for(const w of walkers){w.t=moveRoute(w.h,w.points,w.t,w.speed,dt);w.walk+=dt*8;animateHuman(w.h,w.walk,1)}renderer.render(scene,camera)}animate();
