<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي الدول العربية</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070a12;
  --panel:#101624;
  --panel2:#151d2f;
  --line:rgba(255,255,255,.08);
  --text:#fff;
  --muted:#9aa7bd;
  --gold:#ffd84d;
  --blue:#31c8ff;
  --green:#39e58c;
  --red:#ff4d6d;
}
html,body{
  min-height:100%;
  background:#050810;
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
body{
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  padding:10px;
  background:
    radial-gradient(circle at 50% -10%,rgba(36,95,255,.20),transparent 32%),
    linear-gradient(180deg,#070a12,#05070d);
}
.header{
  position:relative;
  padding:12px 12px 10px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(15,22,38,.92);
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.28);
}
.live{
  position:absolute;
  top:9px;
  left:10px;
  direction:ltr;
  display:flex;align-items:center;gap:5px;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(255,77,109,.12);
  border:1px solid rgba(255,77,109,.28);
  font-size:10px;
  font-weight:900;
  color:#ff93a5;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px var(--red);
  animation:pulse 1s infinite alternate;
}
@keyframes pulse{to{opacity:.35}}
.header h1{
  font-size:23px;
  font-weight:1000;
  letter-spacing:-.5px;
}
.header h1 span{color:var(--gold)}
.callout{
  margin-top:7px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 13px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--gold),#ff9c2b);
  color:#121212;
  font-size:15px;
  font-weight:1000;
}
.sub{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 2px 7px;
}
.section-title b{font-size:13px}
.section-title span{font-size:10px;color:var(--muted)}

.ranking{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.rank-item{
  min-width:0;
  padding:7px 4px 6px;
  border-radius:13px;
  background:var(--panel);
  border:1px solid var(--line);
  text-align:center;
  overflow:hidden;
}
.rank-item.first{
  border-color:rgba(255,216,77,.42);
  background:linear-gradient(180deg,rgba(255,216,77,.17),rgba(15,22,38,.96));
}
.rank-item img{
  width:38px;height:27px;object-fit:cover;
  border-radius:5px;
  border:1px solid rgba(255,255,255,.12);
}
.rank-no{
  font-size:10px;
  color:var(--muted);
  margin-bottom:3px;
  font-weight:900;
}
.rank-name{
  margin-top:3px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.rank-score{
  margin-top:2px;
  font-size:16px;
  font-weight:1000;
  color:var(--gold);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}
.country{
  position:relative;
  display:grid;
  grid-template-columns:58px 1fr 42px;
  align-items:center;
  gap:8px;
  min-height:72px;
  padding:8px;
  border-radius:15px;
  background:linear-gradient(145deg,#111a2b,#0c1220);
  border:1px solid var(--line);
  cursor:pointer;
  user-select:none;
  transition:.15s ease;
  overflow:hidden;
}
.country:active{transform:scale(.98)}
.country.leading{
  border-color:rgba(255,216,77,.34);
  background:linear-gradient(145deg,rgba(255,216,77,.13),#111827);
}
.flag{
  width:58px;height:40px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.11);
}
.info{min-width:0}
.name{
  font-size:13px;
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.score{
  margin-top:3px;
  font-size:21px;
  line-height:1;
  font-weight:1000;
}
.pts{
  margin-top:2px;
  font-size:8px;
  color:var(--muted);
}
.plus-btn{
  width:40px;height:40px;
  border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),#536bff);
  font-size:17px;
  font-weight:1000;
  box-shadow:0 7px 16px rgba(49,200,255,.17);
}
.rank-badge{
  position:absolute;
  top:4px;right:4px;
  min-width:20px;height:18px;
  padding:0 4px;
  border-radius:7px;
  display:grid;place-items:center;
  font-size:8px;
  font-weight:1000;
  background:rgba(4,8,16,.86);
  border:1px solid rgba(255,255,255,.1);
}
.pop{
  position:absolute;
  left:44px;
  bottom:18px;
  color:var(--green);
  font-size:24px;
  font-weight:1000;
  pointer-events:none;
  animation:up .65s ease forwards;
}
@keyframes up{
  from{opacity:1;transform:translateY(8px) scale(.8)}
  to{opacity:0;transform:translateY(-35px) scale(1.2)}
}
.controls{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.btn{
  border:0;
  border-radius:12px;
  padding:9px 8px;
  font-family:inherit;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.undo{background:#17243a;color:#fff}
.reset{
  background:rgba(255,77,109,.12);
  border:1px solid rgba(255,77,109,.18);
  color:#ff8699;
}
.last{
  margin-top:7px;
  padding:8px 10px;
  border-radius:11px;
  background:#0b111d;
  border:1px solid rgba(255,255,255,.05);
  font-size:10px;
  color:var(--muted);
  text-align:center;
  min-height:30px;
}
.last b{color:white}

@media(max-width:390px){
  .app{padding:7px}
  .header h1{font-size:20px}
  .callout{font-size:13px}
  .grid{gap:5px}
  .country{
    grid-template-columns:49px 1fr 35px;
    gap:6px;
    padding:6px;
    min-height:65px
  }
  .flag{width:49px;height:34px}
  .plus-btn{width:34px;height:34px;font-size:15px}
  .name{font-size:11px}
  .score{font-size:18px}
  .ranking{gap:4px}
  .rank-item{padding:5px 2px}
  .rank-item img{width:32px;height:23px}
  .rank-name{font-size:9px}
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="live"><span class="dot"></span>LIVE</div>
    <h1>🌍 تحدي <span>الدول العربية</span></h1>
    <div class="callout">✍️ اكتب دولتك + نقطة</div>
    <div class="sub">كل نقطة ترفع دولتك في الترتيب 🔥</div>
  </header>

  <div class="section-title">
    <b>🏆 الترتيب المباشر</b>
    <span>أفضل 5 دول</span>
  </div>
  <div id="ranking" class="ranking"></div>

  <div class="section-title">
    <b>⚔️ اختر الدولة</b>
    <span>اضغط لإضافة نقطة</span>
  </div>
  <main id="grid" class="grid"></main>

  <div class="controls">
    <button id="undo" class="btn undo">↩️ تراجع عن آخر نقطة</button>
    <button id="reset" class="btn reset">🗑️ تصفير النقاط</button>
  </div>

  <div id="last" class="last">جاهز لبدء التحدي 🔥</div>
</div>

<script>
const baseCountries = [
  ["المغرب","ma"],
  ["الجزائر","dz"],
  ["تونس","tn"],
  ["السعودية","sa"],
  ["العراق","iq"],
  ["مصر","eg"],
  ["فلسطين","ps"],
  ["الأردن","jo"],
  ["الإمارات","ae"],
  ["قطر","qa"]
];

let saved = JSON.parse(localStorage.getItem("arabBattle10") || "{}");
let countries = baseCountries.map(([name,code])=>({
  name,code,score:Number(saved[name]||0)
}));
let history=[];

const grid=document.getElementById("grid");
const ranking=document.getElementById("ranking");
const last=document.getElementById("last");

function flag(code){
  return `https://flagcdn.com/w160/${code}.png`;
}
function sorted(){
  return [...countries].sort((a,b)=>b.score-a.score || a.name.localeCompare(b.name,"ar"));
}
function save(){
  const data={};
  countries.forEach(c=>data[c.name]=c.score);
  localStorage.setItem("arabBattle10",JSON.stringify(data));
}
function render(){
  const list=sorted();

  ranking.innerHTML=list.slice(0,5).map((c,i)=>`
    <div class="rank-item ${i===0&&c.score>0?"first":""}">
      <div class="rank-no">${i===0&&c.score>0?"👑":"#"+(i+1)}</div>
      <img src="${flag(c.code)}" alt="${c.name}">
      <div class="rank-name">${c.name}</div>
      <div class="rank-score">${c.score}</div>
    </div>
  `).join("");

  grid.innerHTML=list.map((c,i)=>`
    <div class="country ${i<3&&c.score>0?"leading":""}" data-name="${c.name}">
      <div class="rank-badge">${i===0&&c.score>0?"👑":"#"+(i+1)}</div>
      <img class="flag" src="${flag(c.code)}" alt="${c.name}">
      <div class="info">
        <div class="name">${c.name}</div>
        <div class="score">${c.score}</div>
        <div class="pts">نقطة</div>
      </div>
      <div class="plus-btn">+1</div>
    </div>
  `).join("");

  document.querySelectorAll(".country").forEach(card=>{
    card.addEventListener("click",()=>addPoint(card.dataset.name));
  });
}
function addPoint(name){
  const c=countries.find(x=>x.name===name);
  if(!c)return;
  c.score++;
  history.push(name);
  save();
  last.innerHTML=`🔥 نقطة جديدة لـ <b>${name}</b> — المجموع <b>${c.score}</b>`;
  render();

  const card=[...document.querySelectorAll(".country")].find(x=>x.dataset.name===name);
  if(card){
    const pop=document.createElement("div");
    pop.className="pop";
    pop.textContent="+1";
    card.appendChild(pop);
  }
}
document.getElementById("undo").addEventListener("click",()=>{
  const name=history.pop();
  if(!name){
    last.textContent="لا توجد نقطة للتراجع عنها.";
    return;
  }
  const c=countries.find(x=>x.name===name);
  if(c&&c.score>0)c.score--;
  save();
  render();
  last.innerHTML=`↩️ تم حذف نقطة من <b>${name}</b>`;
});
document.getElementById("reset").addEventListener("click",()=>{
  if(!confirm("هل تريد تصفير جميع النقاط؟"))return;
  countries.forEach(c=>c.score=0);
  history=[];
  save();
  render();
  last.textContent="تم تصفير جميع النقاط.";
});
render();
</script>
</body>
</html>
